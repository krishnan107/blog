name: Daily Blog Post

on:
  schedule:
    - cron: '30 7 * * *'
  workflow_dispatch:

jobs:
  write-blog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests feedparser
      - name: Write blog post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ secrets.BLOG_TOKEN }}
        run: python .github/scripts/blog_writer.py 2>&1 | tee debug.log; exit ${PIPESTATUS[0]}
      - name: Commit debug log
        if: always()
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add debug.log || true
          git diff --staged --quiet || git commit -m "Debug log"
          git push || true
